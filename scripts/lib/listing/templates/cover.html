<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>{{css}}</style>
<style>:root { --accent: {{accent}}; }</style>
</head>
<body class="cover">
<div class="backdrop"></div>
<div class="left" id="left">
  <img class="icon" id="icon" src="{{icon}}" alt="">
  <h1 id="title"><span class="first" id="title1">{{title1}}</span><span class="second" id="title2">{{title2}}</span></h1>
  <p class="tagline" id="tagline">{{tagline}}</p>
  <div class="chips" id="chips">{{chips}}</div>
</div>
<div class="panel" id="panel"><img id="ui" src="{{ui}}" alt=""></div>
</body>
</html>
